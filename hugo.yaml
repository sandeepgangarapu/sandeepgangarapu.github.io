baseURL: "https://sandeepgangarapu.com/"
languageCode: en-us
title: "Sandeep Gangarapu"
theme: hugo-bearblog
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  description: "Data Scientist at Apple | Statistics, ML, Causal Inference"
  keywords: [data science, statistics, causal inference, machine learning, experimentation]
  favicon: "/favicon.svg"
  # Image shown when a page is shared on social media or in messengers.
  images: ["/images/profile/vivekkrishnanphotography-6_websize.jpg"]
  # Bear-style dates, e.g. "14 Apr, 2023".
  dateFormat: "02 Jan, 2006"
  # Sections listed by the recent-posts shortcode on the home page.
  mainSections:
    - blog
  # Shown as text links in the footer (layouts/partials/footer.html).
  socialIcons:
    - name: LinkedIn
      url: "https://www.linkedin.com/in/sandeepgangarapu/"
    - name: X
      url: "https://x.com/sandeep_g_kumar"
    - name: GitHub
      url: "https://github.com/sandeepgangarapu"
    - name: Email
      url: "mailto:sandeep.k.gangarapu@gmail.com"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: now
      name: Now
      url: /now/
      weight: 35
    - identifier: brief
      name: AI Brief
      url: https://ainews.sandeepgangarapu.com/
      weight: 40

# No tag or series pages. Posts keep their tags/series front matter, so these
# can be turned back on by removing this line and listing the taxonomies again.
disableKinds: [taxonomy, term]
